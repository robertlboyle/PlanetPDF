[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "planetpdf"
version = "1.0.8"
description = "A free, open-source desktop PDF editor"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.14"

[project.gui-scripts]
planetpdf = "planetpdf.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
